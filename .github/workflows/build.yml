name: build

# Reproducible build for the MT6989 scx_leak_hotfix module.
#
# This workflow deliberately fails rather than guessing at a kernel ABI. It
# requires the target .config and Module.symvers to be supplied, because a
# module built against a mismatched struct layout panics the device rather
# than failing to load.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Kernel source commit or branch
        required: true
        default: b1ea2c8ce2ef0f73927a593aa450f88143e3584a

env:
  KERNEL_REPO: OnePlusOSS/android_kernel_common_oneplus_sm8750
  VENDOR_REPO: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8750
  KERNEL_BRANCH: oneplus/sm8750_b_16.0.0_oneplus_13
  KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'e1b346b6b4f4096eb342ae3684838a942fd6f6c4' }}
  CLANG_VERSION: clang-r510928
  KERNEL_BASE_VERSION: 6.6.118
  TARGET_RELEASE: 6.6.118-android15-8-g29d86c5fc9dd-abogki428889875-4k

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Source safety contract
        run: sh tests/source_contract.sh

      - name: Shell syntax
        run: |
          for f in scripts/*.sh tests/*.sh; do
            sh -n "$f"
            echo "ok: $f"
          done

  build:
    name: build module
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7
        with:
          path: module

      - name: Require target build inputs
        run: |
          missing=0
          for f in module/ci/target.config module/ci/Module.symvers; do
            if [ ! -f "$f" ]; then
              echo "missing required input: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            cat <<'EOF'

          This build needs the exact target ABI inputs:

            ci/target.config   extracted from the device boot image with
                               scripts/extract-ikconfig
            ci/Module.symvers  symbol CRCs matching the running kernel

          Building without them produces a module that loads and then panics
          the device on a struct layout mismatch. Refusing to continue.
          EOF
            exit 1
          fi

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex libelf-dev libssl-dev \
            zlib1g-dev dwarves

      - name: Fetch kernel source
        run: |
          git clone --depth=1 --branch "$KERNEL_BRANCH" \
            "https://github.com/$KERNEL_REPO.git" kernel
          cd kernel
          git fetch --depth=1 origin "$KERNEL_REF"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Fetch vendor modules
        # The kernel tree has dangling symlinks into ../vendor/... which must
        # resolve before modules_prepare will run.
        run: |
          git clone --depth=1 --branch "$KERNEL_BRANCH" \
            "https://github.com/$VENDOR_REPO.git" vendor-src
          ln -s "$PWD/vendor-src/vendor" "$PWD/vendor"

      - name: Fetch Android Clang
        run: |
          mkdir -p toolchain
          curl -sSL --retry 5 --retry-delay 10 \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip" \
            -o clang.zip
          unzip -q clang.zip -d toolchain
          toolchain/bin/clang --version

      - name: Prepare kernel tree
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          cp "$GITHUB_WORKSPACE/module/ci/target.config" .config
          cp "$GITHUB_WORKSPACE/module/ci/Module.symvers" Module.symvers
          # The target config has CONFIG_LOCALVERSION="" with
          # CONFIG_LOCALVERSION_AUTO=y: the vendor passed the suffix on the
          # make command line. Left alone, setlocalversion substitutes a git
          # description (6.1.115-g<sha>) and vermagic will not match, so set
          # the suffix explicitly and disable the automatic one.
          ./scripts/config --file .config \
            --set-str LOCALVERSION "${TARGET_RELEASE#$KERNEL_BASE_VERSION}" \
            --disable LOCALVERSION_AUTO
          make ARCH=arm64 LLVM=1 LOCALVERSION= olddefconfig
          make ARCH=arm64 LLVM=1 LOCALVERSION= -j"$(nproc)" modules_prepare
          release=$(cat include/config/kernel.release)
          echo "kernel.release=$release"
          if [ "$release" != "$TARGET_RELEASE" ]; then
            echo "release mismatch: got $release, expected $TARGET_RELEASE"
            exit 1
          fi
          # olddefconfig silently drops options whose dependencies are not
          # satisfied. DEBUG_INFO_BTF_MODULES decides sizeof(struct module):
          # 1088 with it, 1072 without. A 1072 module loads and then panics
          # the device in mod_sysfs_setup(), so this must be checked here
          # rather than discovered at runtime.
          if ! grep -q '^#define CONFIG_DEBUG_INFO_BTF_MODULES 1' \
               include/generated/autoconf.h; then
            echo "CONFIG_DEBUG_INFO_BTF_MODULES did not survive olddefconfig"
            echo "sizeof(struct module) would be 1072 instead of 1088"
            exit 1
          fi

      - name: Build module
        working-directory: module
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make KDIR="$GITHUB_WORKSPACE/kernel" ARCH=arm64 LLVM=1 \
            KCFLAGS="-DCONFIG_HMBIRD_SCHED" \
            LOCALVERSION=
          ls -la scx_leak_hotfix.ko

      - name: Verify vermagic
        working-directory: module
        run: |
          vermagic=$(modinfo -F vermagic scx_leak_hotfix.ko)
          echo "vermagic: $vermagic"
          expected="$TARGET_RELEASE SMP preempt mod_unload modversions aarch64"
          if [ "$vermagic" != "$expected" ]; then
            echo "expected: $expected"
            exit 1
          fi

      - name: Verify symbol CRCs against target
        working-directory: module
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          llvm-objcopy --dump-section=__versions=versions.bin \
            scx_leak_hotfix.ko /dev/null
          python3 - <<'PY'
          import struct, sys
          kern = {}
          with open('../kernel/Module.symvers') as fh:
              for line in fh:
                  f = line.rstrip('\n').split('\t')
                  kern[f[1]] = int(f[0], 16)
          data = open('versions.bin', 'rb').read()
          bad = 0
          for i in range(0, len(data) - 63, 64):
              entry = data[i:i + 64]
              crc = struct.unpack_from('<I', entry, 0)[0]
              name = entry[8:].split(b'\0')[0].decode()
              if kern.get(name) != crc:
                  print(f'MISMATCH {name}: ko=0x{crc:08x} kernel={kern.get(name)}')
                  bad += 1
          print(f'{bad} CRC problems')
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: scx_leak_hotfix
          path: |
            module/scx_leak_hotfix.ko
            module/ci/Module.symvers
            module/ci/target.config
